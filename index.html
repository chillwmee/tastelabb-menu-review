<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="TasteLABB breakfast menu concepts for review.">
  <title>TasteLABB — Menu Review</title>
  <link rel="stylesheet" href="styles.css?v=5">
</head>
<body>
  <header class="topbar">
    <div class="wrap nav">
      <div class="brand"><img src="assets/tastelabb-logo.png" alt="TasteLABB cafe logo"><span>TasteLABB</span></div>
      <span class="review-label">Breakfast Menu Review</span>
    </div>
  </header>

  <main class="wrap">
    <section class="intro">
      <p class="eyebrow">MENU CONCEPTS</p>
      <h1>Choose your preferred version.</h1>
      <p>Click a version below to view the full menu design.</p>
    </section>

    <div class="tabs" role="tablist" aria-label="Menu versions">
      <button class="tab is-active" type="button" role="tab" aria-selected="true" aria-controls="version-a" data-target="version-a"><span>01</span><strong>Version A</strong><small>Navy editorial</small></button>
      <button class="tab" type="button" role="tab" aria-selected="false" aria-controls="version-b" data-target="version-b"><span>02</span><strong>Version B</strong><small>Modern café magazine</small></button>
    </div>

    <section class="panel is-active" id="version-a" role="tabpanel">
      <div class="panel-head">
        <div><p class="eyebrow">VERSION A</p><h2>Navy editorial</h2></div>
      </div>
      <div class="menu-preview" aria-label="Version A menu preview">
        <a href="https://drive.google.com/file/d/1Pm1vbwb4dxM7kjRtmcU_-hLxczdT21yv/view?usp=drivesdk" target="_blank" rel="noopener" aria-label="Open Version A on Google Drive">
          <img src="assets/version-a-page-1.png?v=4" alt="TasteLABB breakfast menu Version A, page 1">
        </a>
        <a href="https://drive.google.com/file/d/1Pm1vbwb4dxM7kjRtmcU_-hLxczdT21yv/view?usp=drivesdk" target="_blank" rel="noopener" aria-label="Open Version A on Google Drive">
          <img src="assets/version-a-page-2.png?v=4" alt="TasteLABB breakfast menu Version A, page 2">
        </a>
      </div>
      <a class="pdf-button" href="https://drive.google.com/file/d/1Pm1vbwb4dxM7kjRtmcU_-hLxczdT21yv/view?usp=drivesdk" target="_blank" rel="noopener">Open PDF on Google Drive ↗</a>
    </section>

    <section class="panel" id="version-b" role="tabpanel" hidden>
      <div class="panel-head">
        <div><p class="eyebrow">VERSION B</p><h2>Modern café magazine</h2></div>
      </div>
      <div class="menu-preview" aria-label="Version B menu preview">
        <a href="https://drive.google.com/file/d/1HqdymRzJLzPjBD5O27_N-9-6uKp1ys8Q/view?usp=drivesdk" target="_blank" rel="noopener" aria-label="Open Version B on Google Drive">
          <img src="assets/version-b-page-1.png?v=11" alt="TasteLABB breakfast menu Version B, page 1">
        </a>
        <a href="https://drive.google.com/file/d/1HqdymRzJLzPjBD5O27_N-9-6uKp1ys8Q/view?usp=drivesdk" target="_blank" rel="noopener" aria-label="Open Version B on Google Drive">
          <img src="assets/version-b-page-2.png?v=11" alt="TasteLABB breakfast menu Version B, page 2">
        </a>
      </div>
      <a class="pdf-button" href="https://drive.google.com/file/d/1HqdymRzJLzPjBD5O27_N-9-6uKp1ys8Q/view?usp=drivesdk" target="_blank" rel="noopener">Open PDF on Google Drive ↗</a>
    </section>
  </main>

  <footer class="wrap">TasteLABB Cafe · Menu Concepts</footer>
  <script src="script.js?v=5"></script>
</body>
</html>
